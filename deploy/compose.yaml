# grower on TrueNAS SCALE (Apps → Discover Apps → ⋮ → Install via YAML).
# Replace every value marked CHANGE. See docs/deploy.md for the full walkthrough.
services:
  grower:
    image: ghcr.io/reilandeubank/grower:main # CHANGE on each update (docs/update.md)
    restart: unless-stopped
    user: "568:568" # TrueNAS "apps" user; must own the dataset
    environment:
      GROWER_BASE_URL: https://grower.example.com # the public URL served by Nginx Proxy Manager
      GROWER_TRUSTED_PROXIES: 192.0.2.10/32
      GROWER_TZ: America/Chicago
    volumes:
      - /mnt/vm-disk/grower:/data
    ports:
      - "18080:8080" # remove if NPM reaches grower over a shared Docker network
