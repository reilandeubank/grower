# grower with Docker Compose. Replace every value marked CHANGE.
# See docs/deploy.md for HTTPS, TrueNAS SCALE (Apps → Install via YAML) and troubleshooting.
services:
  grower:
    image: ghcr.io/reilandeubank/grower:latest # or pin a version, e.g. :1.7.0 (docs/update.md)
    restart: unless-stopped
    user: "1000:1000" # CHANGE: a UID:GID that owns the data directory (TrueNAS apps user: 568:568)
    environment:
      GROWER_BASE_URL: https://grower.example.com # CHANGE: the exact public https URL
      GROWER_TRUSTED_PROXIES: 172.16.0.0/12 # CHANGE: where your reverse proxy connects from (docs/deploy.md)
      GROWER_TZ: UTC # CHANGE: your IANA time zone, e.g. Europe/Berlin
      # Optional species data and photo identification (docs/deploy.md, "Species data").
      # GROWER_OPENPLANTBOOK_CLIENT_ID: CHANGE
      # GROWER_OPENPLANTBOOK_CLIENT_SECRET: CHANGE
      # GROWER_PERENUAL_API_KEY: CHANGE
      # GROWER_PLANTNET_API_KEY: CHANGE
    volumes:
      - ./data:/data # CHANGE: where grower keeps its database, photos and backups
    ports:
      - "8080:8080" # remove if your reverse proxy reaches grower over a shared Docker network
