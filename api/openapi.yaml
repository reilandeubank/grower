openapi: 3.0.3
info:
  title: grower API
  version: 0.1.0
  description: |
    API for grower, a self-hosted plant care app. All paths are relative to /api/v1.
    Authentication is a session cookie set by POST /auth/login. Mutating requests
    must send `Content-Type: application/json` and an Origin matching GROWER_BASE_URL.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      operationId: login
      summary: Log in with username and password; sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in. The session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session and clear the cookie.
      security: []
      responses:
        "204":
          description: Logged out (also returned when there was no session).
  /me:
    get:
      operationId: getMe
      summary: The signed-in user, their settings and the server version.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
  /auth/password:
    post:
      operationId: changePassword
      summary: Change the password. Signs out every other session; this one stays signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /settings:
    put:
      operationId: updateSettings
      summary: Replace the user's settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /storage:
    get:
      operationId: getStorage
      summary: How much space grower uses, and when the last nightly backup ran.
      responses:
        "200":
          description: Storage use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "401":
          $ref: "#/components/responses/Problem"
  /export:
    get:
      operationId: exportData
      summary: Download everything as a zip (format in docs/export-format.md).
      responses:
        "200":
          description: A zip with export.json and the original photo files.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="grower-export-YYYY-MM-DD.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
  /push/vapid-key:
    get:
      operationId: getVapidKey
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidKey"
        "401":
          $ref: "#/components/responses/Problem"
  /push/subscriptions:
    post:
      operationId: subscribePush
      summary: Register this device for the daily reminder. Re-registering an endpoint updates its keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscription"
      responses:
        "204":
          description: Subscribed.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unsubscribePush
      summary: Stop reminders on a device. Unknown endpoints are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribe"
      responses:
        "204":
          description: Unsubscribed.
        "401":
          $ref: "#/components/responses/Problem"
  /push/test:
    post:
      operationId: sendTestPush
      summary: Send a test notification to every device the user has subscribed.
      responses:
        "204":
          description: Sent (or there were no devices).
        "401":
          $ref: "#/components/responses/Problem"
  /species:
    get:
      operationId: listSpecies
      summary: Saved species, matching q in the scientific or common name when given. Never calls a provider.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Species, ordered by scientific name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSpecies
      summary: Save a species by hand (source manual).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Species"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /species/lookup:
    get:
      operationId: lookupSpecies
      summary: Search the configured online providers. Costs provider API calls; results are cached.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: Candidates from every configured provider that answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesLookup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /species/import:
    post:
      operationId: importSpecies
      summary: Fetch a candidate's care details from its provider and save it (or refresh the saved copy).
      description: |
        Matches saved species by scientific name. A species the user has edited keeps their
        values; only raw and fetched_at are refreshed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesRef"
      responses:
        "200":
          description: The saved species.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Species"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /species/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getSpecies
      responses:
        "200":
          description: The species.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Species"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateSpecies
      summary: Edit a species' names and care defaults. Marks it user_edited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Species"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /plants/{id}/apply-species:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: applySpeciesCare
      summary: Apply the linked species' care defaults to the plant's watering task.
      description: |
        Updates the plant's first water task (interval_days, and water_at for a soil check),
        or creates a water task starting today if it has none. Fields the species lacks are
        left alone. 400 when the plant has no species or the species has no defaults.
      responses:
        "200":
          description: The plant's tasks after applying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTaskList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /locations:
    get:
      operationId: listLocations
      summary: All locations, ordered by name, with how many active plants each holds.
      responses:
        "200":
          description: Locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /locations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateLocation
      summary: Replace a location's fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLocation
      summary: Delete a location. Its plants keep existing with no location.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /plants:
    get:
      operationId: listPlants
      summary: Plants ordered by name. Archived plants are excluded unless archived=true.
      parameters:
        - name: archived
          in: query
          description: true lists only archived plants; false (default) only active ones.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Plants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPlant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /plants/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getPlant
      responses:
        "200":
          description: The plant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updatePlant
      summary: Replace a plant's fields, including whether it is archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePlant
      summary: Permanently delete a plant. Archiving is the reversible option.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /today:
    get:
      operationId: getToday
      summary: Care due today or overdue, plus the next 7 days, for active plants.
      description: |
        "Today" is the current date in the user's time zone. Each task appears once,
        in the section its next due date falls in.
      responses:
        "200":
          description: The Today view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Today"
        "401":
          $ref: "#/components/responses/Problem"
  /plants/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listPlantTasks
      summary: A plant's care tasks, ordered by next due date.
      responses:
        "200":
          description: Tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTaskList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareTaskInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTask"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /plants/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listPlantEvents
      summary: A plant's care history, newest first. Undone events are left out.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: History.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEventList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateTask
      summary: Replace a task's schedule. History is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareTaskInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTask"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTask
      summary: Delete a task and its history.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /tasks/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: logTaskEvent
      summary: Record that a task was done, skipped or snoozed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareEventInput"
      responses:
        "201":
          description: Recorded. Returns the event and the task with its new next due date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggedEvent"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /events/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: undoEvent
      summary: Undo an event. It is kept but ignored from now on.
      responses:
        "200":
          description: Undone. Returns the task with its recalculated next due date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTask"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /plants/{id}/photos:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listPlantPhotos
      summary: A plant's photos, newest taken_at first.
      responses:
        "200":
          description: Photos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: uploadPhoto
      summary: Upload a JPEG or PNG (max 15 MB). The plant's first photo becomes its cover.
      description: |
        Clients should downscale to at most 2560 px on the long side and re-encode as JPEG
        before uploading. Uploading the same bytes to the same plant again returns the
        existing photo with 200.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUpload"
      responses:
        "200":
          description: Already uploaded; the existing photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "201":
          description: Uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
  /plants/{id}/cover:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setPlantCover
      summary: Choose the plant's cover photo, or clear it with null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverInput"
      responses:
        "200":
          description: The plant with its new cover.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /photos/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updatePhoto
      summary: Replace a photo's caption and date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePhoto
      summary: Delete a photo and its files. If it was the cover, the newest remaining photo becomes the cover.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: grower_session
      description: The cookie is named `__Host-grower_session` when GROWER_BASE_URL is https.
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    Settings:
      type: object
      required: [timezone, digest_time, hemisphere]
      properties:
        hemisphere:
          type: string
          enum: [north, south]
          description: Decides which months count as winter for seasonal care adjustment.
        timezone:
          type: string
          description: IANA time zone used to decide what "today" is.
          example: America/Chicago
        digest_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time (HH:MM) of the daily care reminder, sent to every subscribed device.
          example: "08:00"
    PushSubscription:
      type: object
      description: A browser PushSubscription, as returned by PushSubscription.toJSON().
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          maxLength: 2048
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              maxLength: 256
            auth:
              type: string
              maxLength: 256
    PushUnsubscribe:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string
          maxLength: 2048
    VapidKey:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: The server's VAPID public key, URL-safe base64, for PushManager.subscribe.
    Me:
      type: object
      required: [user, settings, version]
      properties:
        user:
          $ref: "#/components/schemas/User"
        settings:
          $ref: "#/components/schemas/Settings"
        version:
          type: string
          description: Server build version.
          example: v0.1.0
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          minLength: 10
          maxLength: 256
    Storage:
      type: object
      required: [photo_count, photo_bytes, database_bytes, last_backup_at]
      properties:
        photo_count:
          type: integer
        photo_bytes:
          type: integer
          format: int64
          description: Size of all photo files, originals and thumbnails.
        database_bytes:
          type: integer
          format: int64
        last_backup_at:
          type: string
          format: date-time
          nullable: true
          description: When the newest nightly backup in <data>/backups was written.
    SpeciesSource:
      type: string
      enum: [openplantbook, perenual, manual]
    SpeciesInput:
      type: object
      required: [scientific_name]
      properties:
        scientific_name:
          type: string
          minLength: 1
          maxLength: 120
        common_name:
          type: string
          maxLength: 120
          default: ""
        water_interval_days:
          type: integer
          minimum: 1
          maximum: 365
          nullable: true
        light:
          allOf:
            - $ref: "#/components/schemas/LightLevel"
          nullable: true
        water_at:
          type: integer
          minimum: 1
          maximum: 9
          nullable: true
          description: Moisture meter level (1–10 scale) to water at, for soil-check tasks.
        notes:
          type: string
          maxLength: 2000
          default: ""
    Species:
      type: object
      required: [id, scientific_name, common_name, source, source_ref, water_interval_days, light, water_at, notes, fetched_at, user_edited, plant_count]
      properties:
        id:
          type: string
        scientific_name:
          type: string
        common_name:
          type: string
        source:
          $ref: "#/components/schemas/SpeciesSource"
        source_ref:
          type: string
        water_interval_days:
          type: integer
          nullable: true
        light:
          allOf:
            - $ref: "#/components/schemas/LightLevel"
          nullable: true
        water_at:
          type: integer
          nullable: true
        notes:
          type: string
        fetched_at:
          type: string
          format: date-time
          nullable: true
        user_edited:
          type: boolean
        plant_count:
          type: integer
          description: Active plants linked to this species.
    SpeciesList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Species"
    SpeciesRef:
      type: object
      required: [source, ref]
      properties:
        source:
          type: string
          enum: [openplantbook, perenual]
        ref:
          type: string
          minLength: 1
          maxLength: 200
          description: The provider's own id for the species.
    SpeciesCandidate:
      type: object
      required: [source, ref, scientific_name, common_name, saved_id]
      properties:
        source:
          type: string
          enum: [openplantbook, perenual]
        ref:
          type: string
        scientific_name:
          type: string
        common_name:
          type: string
        saved_id:
          type: string
          nullable: true
          description: The saved species with this scientific name, if any.
    SpeciesLookup:
      type: object
      required: [providers, items]
      properties:
        providers:
          type: array
          description: Configured providers and whether each answered this search.
          items:
            type: object
            required: [source, ok]
            properties:
              source:
                type: string
                enum: [openplantbook, perenual]
              ok:
                type: boolean
              detail:
                type: string
                description: Why it didn't answer (e.g. daily limit reached).
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpeciesCandidate"
    PotType:
      type: string
      enum: [plastic, terracotta, ceramic, fabric, self_watering, other]
    LightLevel:
      type: string
      enum: [low, medium, bright_indirect, direct]
    LocationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Unique, case-insensitive. Leading and trailing spaces are trimmed.
        light:
          allOf:
            - $ref: "#/components/schemas/LightLevel"
          nullable: true
          description: The room's light, set by hand. When null, suggested_light from the windows is used.
        windows:
          type: array
          maxItems: 8
          default: []
          description: Windows by facing direction; at most one entry per direction.
          items:
            $ref: "#/components/schemas/Window"
        notes:
          type: string
          maxLength: 2000
          default: ""
    Location:
      type: object
      required: [id, name, light, windows, suggested_light, notes, plant_count]
      properties:
        windows:
          type: array
          items:
            $ref: "#/components/schemas/Window"
        suggested_light:
          allOf:
            - $ref: "#/components/schemas/LightLevel"
          nullable: true
          description: |
            Estimated from the brightest window and the user's hemisphere (internal/light):
            equator-facing (S in the north) direct; E, W, SE, SW bright_indirect;
            pole-facing (N, NE, NW) medium. Null with no windows.
        id:
          type: string
        name:
          type: string
        light:
          allOf:
            - $ref: "#/components/schemas/LightLevel"
          nullable: true
        notes:
          type: string
        plant_count:
          type: integer
          description: Active (not archived) plants in this location.
    Direction:
      type: string
      enum: [n, ne, e, se, s, sw, w, nw]
    Window:
      type: object
      required: [direction, count]
      properties:
        direction:
          $ref: "#/components/schemas/Direction"
        count:
          type: integer
          minimum: 1
          maximum: 9
    WindowDistance:
      type: string
      enum: [at_window, near, across_room]
      description: at_window keeps the room's light; near (within about 3 ft) is one step dimmer; across_room two.
    EffectiveLight:
      type: object
      required: [level, source]
      properties:
        level:
          $ref: "#/components/schemas/LightLevel"
        source:
          type: string
          enum: [plant, location, windows, grow_light]
          description: |
            plant: the plant's own light setting. location / windows: the room's set or
            suggested light, dimmed by window_distance. grow_light: a grow light raised it.
    LocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
    PlantInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        species:
          type: string
          maxLength: 120
          default: ""
          description: Free text, e.g. "Monstera deliciosa". Shown when no species is linked.
        light:
          allOf:
            - $ref: "#/components/schemas/LightLevel"
          nullable: true
          description: The light this plant gets, set by hand. Overrides everything derived.
        window_distance:
          allOf:
            - $ref: "#/components/schemas/WindowDistance"
          nullable: true
        grow_light_hours:
          type: integer
          minimum: 1
          maximum: 24
          nullable: true
          description: Hours a day under a grow light; null when it has none.
        species_id:
          type: string
          nullable: true
          description: A species from /species, whose care defaults the plant can apply.
        location_id:
          type: string
          nullable: true
        acquired_on:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          maxLength: 4000
          default: ""
        pot_type:
          allOf:
            - $ref: "#/components/schemas/PotType"
          nullable: true
        pot_size_in:
          type: number
          format: double
          minimum: 0.5
          maximum: 48
          nullable: true
          description: Pot diameter in inches.
        drainage:
          type: boolean
          nullable: true
          description: Whether the pot has drainage holes; null when not recorded.
        soil:
          type: string
          maxLength: 120
          default: ""
          description: Free text, e.g. "Aroid mix".
    PlantUpdate:
      allOf:
        - $ref: "#/components/schemas/PlantInput"
        - type: object
          required: [archived]
          properties:
            archived:
              type: boolean
    Plant:
      type: object
      required: [id, name, species, species_id, light, window_distance, grow_light_hours, effective_light, location_id, acquired_on, notes, pot_type, pot_size_in, drainage, soil, archived, cover, created_at]
      properties:
        light:
          allOf:
            - $ref: "#/components/schemas/LightLevel"
          nullable: true
        window_distance:
          allOf:
            - $ref: "#/components/schemas/WindowDistance"
          nullable: true
        grow_light_hours:
          type: integer
          nullable: true
          description: Hours a day under a grow light; null when it has none.
        effective_light:
          allOf:
            - $ref: "#/components/schemas/EffectiveLight"
          nullable: true
          description: What the plant actually gets (internal/light). Null when nothing is known.
        species_id:
          type: string
          nullable: true
        cover:
          allOf:
            - $ref: "#/components/schemas/Photo"
          nullable: true
          description: The cover photo, or null when the plant has none.
        id:
          type: string
        name:
          type: string
        species:
          type: string
        location_id:
          type: string
          nullable: true
        acquired_on:
          type: string
          format: date
          nullable: true
        notes:
          type: string
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        pot_type:
          allOf:
            - $ref: "#/components/schemas/PotType"
          nullable: true
        pot_size_in:
          type: number
          format: double
          minimum: 0.5
          maximum: 48
          nullable: true
          description: Pot diameter in inches.
        drainage:
          type: boolean
          nullable: true
          description: Whether the pot has drainage holes; null when not recorded.
        soil:
          type: string
          maxLength: 120
          description: Free text, e.g. "Aroid mix".
    PlantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Plant"
    PhotoUrls:
      type: object
      description: |
        Same-origin URLs, served outside /api at /media/photos/{id}/{small|medium|original}.
        They require the session cookie and never change for a given photo.
      required: [small, medium, original]
      properties:
        small:
          type: string
          description: JPEG, 256 px on the long side.
        medium:
          type: string
          description: JPEG, 1024 px on the long side.
        original:
          type: string
    Photo:
      type: object
      required: [id, plant_id, taken_at, caption, width, height, urls]
      properties:
        id:
          type: string
        plant_id:
          type: string
        taken_at:
          type: string
          format: date-time
        caption:
          type: string
        width:
          type: integer
        height:
          type: integer
        urls:
          $ref: "#/components/schemas/PhotoUrls"
    PhotoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
    PhotoUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        caption:
          type: string
          maxLength: 500
        taken_at:
          type: string
          format: date-time
          description: When the photo was taken. Defaults to the upload time.
    PhotoInput:
      type: object
      required: [caption, taken_at]
      properties:
        caption:
          type: string
          maxLength: 500
        taken_at:
          type: string
          format: date-time
    CoverInput:
      type: object
      required: [photo_id]
      properties:
        photo_id:
          type: string
          nullable: true
    TaskKind:
      type: string
      enum: [water, fertilize, mist, repot, rotate, custom]
    Anchor:
      type: string
      enum: [from_completion, fixed]
      description: |
        from_completion: the next due date counts from when the task was last done or skipped.
        fixed: due dates stay on start_on + k × interval_days regardless of when it was done.
    CareTaskInput:
      type: object
      required: [kind, interval_days]
      properties:
        kind:
          $ref: "#/components/schemas/TaskKind"
        label:
          type: string
          maxLength: 40
          default: ""
          description: Required for custom tasks; ignored otherwise.
        interval_days:
          type: integer
          minimum: 1
          maximum: 365
        anchor:
          allOf:
            - $ref: "#/components/schemas/Anchor"
          default: from_completion
        start_on:
          type: string
          format: date
          description: First due date. Defaults to today in the user's time zone.
        seasonal:
          type: boolean
          description: |
            Stretch or shorten the interval by season (internal/schedule's built-in curves).
            Defaults to true for water, mist and fertilize, false otherwise. PUT replaces the
            whole task, so omitting it there resets it to that default too. Only applies to the
            from_completion anchor; fixed schedules keep their calendar.
            Ignored for moisture-check tasks, which learn from readings instead.
        moisture_check:
          type: boolean
          default: false
          description: |
            Water tasks only. The task becomes a soil check: due dates are when to check, and
            readings decide when to water (PLAN §5.5). interval_days is the first estimate of
            how long the soil takes to dry out. Forces the from_completion anchor.
        water_at:
          type: integer
          minimum: 1
          maximum: 9
          default: 3
          description: Water when a reading is at or below this (moisture-check tasks only).
    CareTask:
      type: object
      required: [id, plant_id, kind, label, interval_days, anchor, start_on, seasonal, moisture_check, water_at, last_reading, drying_days, current_interval_days, next_due, last_done]
      properties:
        id:
          type: string
        plant_id:
          type: string
        kind:
          $ref: "#/components/schemas/TaskKind"
        label:
          type: string
        interval_days:
          type: integer
        anchor:
          $ref: "#/components/schemas/Anchor"
        start_on:
          type: string
          format: date
        next_due:
          type: string
          format: date
        last_done:
          type: string
          format: date
          nullable: true
          description: The last date it was done (skips and snoozes don't count).
        seasonal:
          type: boolean
        moisture_check:
          type: boolean
        water_at:
          type: integer
        last_reading:
          type: object
          nullable: true
          description: The most recent reading on this task, from a check or a watering.
          required: [value, on]
          properties:
            value:
              $ref: "#/components/schemas/MoistureReading"
            "on":
              type: string
              format: date
        drying_days:
          type: integer
          nullable: true
          description: |
            Moisture-check tasks: the learned days from watering until the soil reads dry
            (median of recent cycles). Null until a cycle has been observed.
        current_interval_days:
          type: integer
          description: |
            The interval this season, after seasonal adjustment: what the next due date
            is counted with. Equals interval_days when not seasonal. For moisture-check tasks,
            drying_days when known, else interval_days.
    CareTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CareTask"
    EventKind:
      type: string
      enum: [done, skipped, snoozed, checked]
      description: checked records a soil moisture reading on a moisture-check task.
    MoistureReading:
      type: integer
      minimum: 1
      maximum: 10
      description: Moisture meter reading. 1–3 dry, 4–7 moist, 8–10 wet.
    CareEventInput:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/EventKind"
        local_date:
          type: string
          format: date
          description: |
            The user's local date when it happened. Defaults to today in the user's time zone;
            must be within a day of it, so a tap just before midnight counts for that day.
        snooze_until:
          type: string
          format: date
          description: Required for snoozed, and must be after today. Not allowed otherwise.
        reading:
          allOf:
            - $ref: "#/components/schemas/MoistureReading"
          description: |
            Required for checked. Optional for done on a moisture-check task (the reading taken
            just before watering). Not allowed otherwise.
        note:
          type: string
          maxLength: 500
          default: ""
    CareEvent:
      type: object
      required: [id, task_id, kind, local_date, snooze_until, reading, note, occurred_at]
      properties:
        reading:
          allOf:
            - $ref: "#/components/schemas/MoistureReading"
          nullable: true
        id:
          type: string
        task_id:
          type: string
        kind:
          $ref: "#/components/schemas/EventKind"
        local_date:
          type: string
          format: date
        snooze_until:
          type: string
          format: date
          nullable: true
        note:
          type: string
        occurred_at:
          type: string
          format: date-time
    LoggedEvent:
      type: object
      required: [event, task]
      properties:
        event:
          $ref: "#/components/schemas/CareEvent"
        task:
          $ref: "#/components/schemas/CareTask"
    HistoryEntry:
      type: object
      required: [event, task_kind, task_label]
      properties:
        event:
          $ref: "#/components/schemas/CareEvent"
        task_kind:
          $ref: "#/components/schemas/TaskKind"
        task_label:
          type: string
    CareEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
    TodayItem:
      type: object
      required: [task, plant, days_overdue]
      properties:
        task:
          $ref: "#/components/schemas/CareTask"
        plant:
          $ref: "#/components/schemas/Plant"
        days_overdue:
          type: integer
          description: Days past task.next_due; 0 when due today, negative when upcoming.
    Today:
      type: object
      required: [date, task_count, overdue, due, upcoming]
      properties:
        task_count:
          type: integer
          description: Care tasks on active plants, due or not. 0 means none have been set up.
        date:
          type: string
          format: date
          description: Today in the user's time zone.
        overdue:
          type: array
          description: Most overdue first.
          items:
            $ref: "#/components/schemas/TodayItem"
        due:
          type: array
          items:
            $ref: "#/components/schemas/TodayItem"
        upcoming:
          type: array
          description: Due within the next 7 days, soonest first.
          items:
            $ref: "#/components/schemas/TodayItem"
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
