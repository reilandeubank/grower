openapi: 3.0.3
info:
  title: grower API
  version: 0.1.0
  description: |
    API for grower, a self-hosted plant care app. All paths are relative to /api/v1.
    Authentication is a session cookie set by POST /auth/login. Mutating requests
    must send `Content-Type: application/json` and an Origin matching GROWER_BASE_URL.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      operationId: login
      summary: Log in with username and password; sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in. The session cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session and clear the cookie.
      security: []
      responses:
        "204":
          description: Logged out (also returned when there was no session).
  /me:
    get:
      operationId: getMe
      summary: The signed-in user, their settings and the server version.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
  /locations:
    get:
      operationId: listLocations
      summary: All locations, ordered by name, with how many active plants each holds.
      responses:
        "200":
          description: Locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /locations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateLocation
      summary: Replace a location's fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLocation
      summary: Delete a location. Its plants keep existing with no location.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /plants:
    get:
      operationId: listPlants
      summary: Plants ordered by name. Archived plants are excluded unless archived=true.
      parameters:
        - name: archived
          in: query
          description: true lists only archived plants; false (default) only active ones.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Plants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantList"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPlant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /plants/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getPlant
      responses:
        "200":
          description: The plant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updatePlant
      summary: Replace a plant's fields, including whether it is archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePlant
      summary: Permanently delete a plant. Archiving is the reversible option.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /today:
    get:
      operationId: getToday
      summary: Care due today or overdue, plus the next 7 days, for active plants.
      description: |
        "Today" is the current date in the user's time zone. Each task appears once,
        in the section its next due date falls in.
      responses:
        "200":
          description: The Today view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Today"
        "401":
          $ref: "#/components/responses/Problem"
  /plants/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listPlantTasks
      summary: A plant's care tasks, ordered by next due date.
      responses:
        "200":
          description: Tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTaskList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareTaskInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTask"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /plants/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listPlantEvents
      summary: A plant's care history, newest first. Undone events are left out.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: History.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEventList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateTask
      summary: Replace a task's schedule. History is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareTaskInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTask"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTask
      summary: Delete a task and its history.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /tasks/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: logTaskEvent
      summary: Record that a task was done, skipped or snoozed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareEventInput"
      responses:
        "201":
          description: Recorded. Returns the event and the task with its new next due date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggedEvent"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /events/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: undoEvent
      summary: Undo an event. It is kept but ignored from now on.
      responses:
        "200":
          description: Undone. Returns the task with its recalculated next due date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTask"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /plants/{id}/photos:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listPlantPhotos
      summary: A plant's photos, newest taken_at first.
      responses:
        "200":
          description: Photos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: uploadPhoto
      summary: Upload a JPEG or PNG (max 15 MB). The plant's first photo becomes its cover.
      description: |
        Clients should downscale to at most 2560 px on the long side and re-encode as JPEG
        before uploading. Uploading the same bytes to the same plant again returns the
        existing photo with 200.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUpload"
      responses:
        "200":
          description: Already uploaded; the existing photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "201":
          description: Uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
  /plants/{id}/cover:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setPlantCover
      summary: Choose the plant's cover photo, or clear it with null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverInput"
      responses:
        "200":
          description: The plant with its new cover.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /photos/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updatePhoto
      summary: Replace a photo's caption and date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePhoto
      summary: Delete a photo and its files. If it was the cover, the newest remaining photo becomes the cover.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: grower_session
      description: The cookie is named `__Host-grower_session` when GROWER_BASE_URL is https.
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    Settings:
      type: object
      required: [timezone]
      properties:
        timezone:
          type: string
          description: IANA time zone used to decide what "today" is.
          example: America/Chicago
    Me:
      type: object
      required: [user, settings, version]
      properties:
        user:
          $ref: "#/components/schemas/User"
        settings:
          $ref: "#/components/schemas/Settings"
        version:
          type: string
          description: Server build version.
          example: v0.1.0
    LightLevel:
      type: string
      enum: [low, medium, bright_indirect, direct]
    LocationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Unique, case-insensitive. Leading and trailing spaces are trimmed.
        light:
          allOf:
            - $ref: "#/components/schemas/LightLevel"
          nullable: true
        notes:
          type: string
          maxLength: 2000
          default: ""
    Location:
      type: object
      required: [id, name, light, notes, plant_count]
      properties:
        id:
          type: string
        name:
          type: string
        light:
          allOf:
            - $ref: "#/components/schemas/LightLevel"
          nullable: true
        notes:
          type: string
        plant_count:
          type: integer
          description: Active (not archived) plants in this location.
    LocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
    PlantInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        species:
          type: string
          maxLength: 120
          default: ""
          description: Free text for now, e.g. "Monstera deliciosa".
        location_id:
          type: string
          nullable: true
        acquired_on:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          maxLength: 4000
          default: ""
    PlantUpdate:
      allOf:
        - $ref: "#/components/schemas/PlantInput"
        - type: object
          required: [archived]
          properties:
            archived:
              type: boolean
    Plant:
      type: object
      required: [id, name, species, location_id, acquired_on, notes, archived, cover, created_at]
      properties:
        cover:
          allOf:
            - $ref: "#/components/schemas/Photo"
          nullable: true
          description: The cover photo, or null when the plant has none.
        id:
          type: string
        name:
          type: string
        species:
          type: string
        location_id:
          type: string
          nullable: true
        acquired_on:
          type: string
          format: date
          nullable: true
        notes:
          type: string
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
    PlantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Plant"
    PhotoUrls:
      type: object
      description: |
        Same-origin URLs, served outside /api at /media/photos/{id}/{small|medium|original}.
        They require the session cookie and never change for a given photo.
      required: [small, medium, original]
      properties:
        small:
          type: string
          description: JPEG, 256 px on the long side.
        medium:
          type: string
          description: JPEG, 1024 px on the long side.
        original:
          type: string
    Photo:
      type: object
      required: [id, plant_id, taken_at, caption, width, height, urls]
      properties:
        id:
          type: string
        plant_id:
          type: string
        taken_at:
          type: string
          format: date-time
        caption:
          type: string
        width:
          type: integer
        height:
          type: integer
        urls:
          $ref: "#/components/schemas/PhotoUrls"
    PhotoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
    PhotoUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        caption:
          type: string
          maxLength: 500
        taken_at:
          type: string
          format: date-time
          description: When the photo was taken. Defaults to the upload time.
    PhotoInput:
      type: object
      required: [caption, taken_at]
      properties:
        caption:
          type: string
          maxLength: 500
        taken_at:
          type: string
          format: date-time
    CoverInput:
      type: object
      required: [photo_id]
      properties:
        photo_id:
          type: string
          nullable: true
    TaskKind:
      type: string
      enum: [water, fertilize, mist, repot, rotate, custom]
    Anchor:
      type: string
      enum: [from_completion, fixed]
      description: |
        from_completion: the next due date counts from when the task was last done or skipped.
        fixed: due dates stay on start_on + k × interval_days regardless of when it was done.
    CareTaskInput:
      type: object
      required: [kind, interval_days]
      properties:
        kind:
          $ref: "#/components/schemas/TaskKind"
        label:
          type: string
          maxLength: 40
          default: ""
          description: Required for custom tasks; ignored otherwise.
        interval_days:
          type: integer
          minimum: 1
          maximum: 365
        anchor:
          allOf:
            - $ref: "#/components/schemas/Anchor"
          default: from_completion
        start_on:
          type: string
          format: date
          description: First due date. Defaults to today in the user's time zone.
    CareTask:
      type: object
      required: [id, plant_id, kind, label, interval_days, anchor, start_on, next_due, last_done]
      properties:
        id:
          type: string
        plant_id:
          type: string
        kind:
          $ref: "#/components/schemas/TaskKind"
        label:
          type: string
        interval_days:
          type: integer
        anchor:
          $ref: "#/components/schemas/Anchor"
        start_on:
          type: string
          format: date
        next_due:
          type: string
          format: date
        last_done:
          type: string
          format: date
          nullable: true
          description: The last date it was done (skips and snoozes don't count).
    CareTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CareTask"
    EventKind:
      type: string
      enum: [done, skipped, snoozed]
    CareEventInput:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/EventKind"
        local_date:
          type: string
          format: date
          description: |
            The user's local date when it happened. Defaults to today in the user's time zone;
            must be within a day of it, so a tap just before midnight counts for that day.
        snooze_until:
          type: string
          format: date
          description: Required for snoozed, and must be after today. Not allowed otherwise.
        note:
          type: string
          maxLength: 500
          default: ""
    CareEvent:
      type: object
      required: [id, task_id, kind, local_date, snooze_until, note, occurred_at]
      properties:
        id:
          type: string
        task_id:
          type: string
        kind:
          $ref: "#/components/schemas/EventKind"
        local_date:
          type: string
          format: date
        snooze_until:
          type: string
          format: date
          nullable: true
        note:
          type: string
        occurred_at:
          type: string
          format: date-time
    LoggedEvent:
      type: object
      required: [event, task]
      properties:
        event:
          $ref: "#/components/schemas/CareEvent"
        task:
          $ref: "#/components/schemas/CareTask"
    HistoryEntry:
      type: object
      required: [event, task_kind, task_label]
      properties:
        event:
          $ref: "#/components/schemas/CareEvent"
        task_kind:
          $ref: "#/components/schemas/TaskKind"
        task_label:
          type: string
    CareEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
    TodayItem:
      type: object
      required: [task, plant, days_overdue]
      properties:
        task:
          $ref: "#/components/schemas/CareTask"
        plant:
          $ref: "#/components/schemas/Plant"
        days_overdue:
          type: integer
          description: Days past task.next_due; 0 when due today, negative when upcoming.
    Today:
      type: object
      required: [date, task_count, overdue, due, upcoming]
      properties:
        task_count:
          type: integer
          description: Care tasks on active plants, due or not. 0 means none have been set up.
        date:
          type: string
          format: date
          description: Today in the user's time zone.
        overdue:
          type: array
          description: Most overdue first.
          items:
            $ref: "#/components/schemas/TodayItem"
        due:
          type: array
          items:
            $ref: "#/components/schemas/TodayItem"
        upcoming:
          type: array
          description: Due within the next 7 days, soonest first.
          items:
            $ref: "#/components/schemas/TodayItem"
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
